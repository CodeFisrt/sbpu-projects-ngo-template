<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NGO Header</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    /* Top black bar */
    .top-bar {
      background: #111;
      color: #fff;
      padding: 5px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .top-bar-left i, .top-bar-right i {
      margin-right: 5px;
    }
    .top-bar-right a {
      color: #fff;
      margin: 0 6px;
      text-decoration: none;
    }

    /* Main navigation */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 40px;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .logo img {
      height: 60px;
    }
    .logo-text {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    .menu {
      display: flex;
      gap: 25px;
      font-weight: 500;
    }
    .menu a {
      text-decoration: none;
      color: #333;
    }
    .donate-btn {
      background: #fdd835;
      color: #000;
      padding: 10px 20px;
      border: none;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }
    .donate-btn i {
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <!-- Top Black Bar -->
  <div class="top-bar">
    <div class="top-bar-left">
      <i class="fa-regular fa-envelope"></i> writetous@navidish.org &nbsp; | &nbsp;
      <i class="fa-solid fa-phone"></i> +91 9876 543 210
    </div>
    <div class="top-bar-right">
      <input type="text" placeholder="Search" style="padding: 4px 10px; border-radius: 15px; border: none;" />
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="#"><i class="fab fa-x-twitter"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-linkedin-in"></i></a>
      <a href="#"><i class="fab fa-youtube"></i></a>
    </div>
  </div>

  <!-- Main Navigation Bar -->
  <div class="nav-bar">
    <div class="logo">
    <img src="logo.gif" alt="Navi Dish Swam Foundation Logo" />
      <span class="logo-text">Navi Dish Swam Foundation</span>
    </div>
    <div class="menu">
      <a href="#">Home</a>
      <a href="#">Who We Are?</a>
      <a href="#">What We Do?</a>
      <a href="#">Get Involved</a>
      <a href="#">Resources</a>
    </div>
    <button class="donate-btn"><i class="fa-solid fa-heart"></i> Donate Now</button>
  </div>

</body>
</html>
